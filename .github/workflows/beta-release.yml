name: Release Theme (beta)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  beta:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          path: theme
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Determine beta version
        id: version
        working-directory: theme
        run: |
          BASE=$(grep -m1 '^Version:' style.css | sed 's/Version:[[:space:]]*//')
          VERSION="${BASE}-beta.${{ github.event.pull_request.number }}.${{ github.run_number }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create distributable ZIP
        working-directory: theme
        run: |
          zip -r ../eshobe-ecommerce-wp-theme.zip . \
            -x ".git/*" ".github/*" ".gitignore" ".remember/*" ".superpowers/*" \
               ".playwright-mcp/*" "docs/*" "*.png"

      - name: Checkout dist repo
        uses: actions/checkout@v4
        with:
          repository: hamidnoshady/eshobe-ecommerce-wp-theme-dist
          token: ${{ secrets.GITHUB_TOKEN }}
          path: dist

      - name: Publish to dist repo (beta channel)
        run: |
          mkdir -p dist/beta
          cp eshobe-ecommerce-wp-theme.zip dist/beta/eshobe-ecommerce-wp-theme.zip
          cat > dist/beta/update.json <<EOF
          {
            "version": "${{ steps.version.outputs.version }}",
            "download_url": "https://raw.githubusercontent.com/hamidnoshady/eshobe-ecommerce-wp-theme-dist/main/beta/eshobe-ecommerce-wp-theme.zip",
            "changelog": "Beta build from PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cd dist
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add beta/
          git commit -m "Beta build for PR #${{ github.event.pull_request.number }} (${{ steps.version.outputs.version }})" || echo "Nothing to commit"
          git push
