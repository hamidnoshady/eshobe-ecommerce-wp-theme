name: Release Theme (stable)

on:
  push:
    tags:
      - 'v[0-9]*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout theme source
        uses: actions/checkout@v4
        with:
          path: theme

      - name: Create distributable ZIP
        working-directory: theme
        run: |
          zip -r ../eshobe-ecommerce-wp-theme.zip . \
            -x ".git/*" ".github/*" ".gitignore" ".remember/*" ".superpowers/*" \
               ".playwright-mcp/*" "docs/*" "*.png"

      - name: Create GitHub Release (source repo, for changelog history)
        uses: softprops/action-gh-release@v2
        with:
          files: eshobe-ecommerce-wp-theme.zip
          generate_release_notes: true

      - name: Checkout dist repo
        uses: actions/checkout@v4
        with:
          repository: hamidnoshady/eshobe-ecommerce-wp-theme-dist
          token: ${{ secrets.DIST_REPO_TOKEN }}
          path: dist

      - name: Publish to dist repo (stable channel)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist/stable
          cp eshobe-ecommerce-wp-theme.zip dist/stable/eshobe-ecommerce-wp-theme.zip
          cat > dist/stable/update.json <<EOF
          {
            "version": "${VERSION}",
            "download_url": "https://raw.githubusercontent.com/hamidnoshady/eshobe-ecommerce-wp-theme-dist/main/stable/eshobe-ecommerce-wp-theme.zip",
            "changelog": "See https://github.com/hamidnoshady/eshobe-ecommerce-wp-theme/releases/tag/${GITHUB_REF_NAME}",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cd dist
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stable/
          git commit -m "Stable release ${VERSION}" || echo "Nothing to commit"
          git push
