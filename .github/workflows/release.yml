name: Release Theme (stable)

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout theme source
        uses: actions/checkout@v4
        with:
          path: theme
          fetch-depth: 0

      - name: Determine version and skip if already released
        id: version
        working-directory: theme
        run: |
          VERSION=$(grep -m1 '^Version:' style.css | sed 's/Version:[[:space:]]*//' | tr -d '\r')
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists, nothing new to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Tag release commit
        if: steps.version.outputs.skip == 'false'
        working-directory: theme
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create distributable ZIP
        if: steps.version.outputs.skip == 'false'
        working-directory: theme
        run: |
          zip -r ../eshobe-ecommerce-wp-theme.zip . \
            -x ".git/*" ".github/*" ".gitignore" ".remember/*" ".superpowers/*" \
               ".playwright-mcp/*" "docs/*" "*.png"

      - name: Create GitHub Release (source repo, for changelog history)
        if: steps.version.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: eshobe-ecommerce-wp-theme.zip
          generate_release_notes: true

      - name: Checkout dist repo
        if: steps.version.outputs.skip == 'false'
        uses: actions/checkout@v4
        with:
          repository: hamidnoshady/eshobe-ecommerce-wp-theme-dist
          token: ${{ secrets.DIST_REPO_TOKEN }}
          path: dist

      - name: Publish to dist repo (stable channel)
        if: steps.version.outputs.skip == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist/stable
          cp eshobe-ecommerce-wp-theme.zip dist/stable/eshobe-ecommerce-wp-theme.zip
          cat > dist/stable/update.json <<EOF
          {
            "version": "${VERSION}",
            "download_url": "https://raw.githubusercontent.com/hamidnoshady/eshobe-ecommerce-wp-theme-dist/main/stable/eshobe-ecommerce-wp-theme.zip",
            "changelog": "See https://github.com/hamidnoshady/eshobe-ecommerce-wp-theme/releases/tag/v${VERSION}",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cd dist
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stable/
          git commit -m "Stable release ${VERSION}" || echo "Nothing to commit"
          git push
